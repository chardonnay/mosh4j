# Build and publish JARs for x86_64 (amd64) and ARM64 when a new GitHub Release is published.
# JARs are attached to the release as *-amd64.jar and *-arm64.jar per module.

name: Release Build (amd64 + arm64)

on:
  release:
    types: [published]
  workflow_dispatch:  # run manually from Actions tab to test the workflow

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Collect and tag JARs by architecture
        run: |
          mkdir -p release-jars
          for f in $(find . -path '*/target/*.jar' \
            ! -name '*-sources*.jar' \
            ! -name '*-javadoc*.jar' \
            ! -name '*-tests*.jar' \
            ! -name 'original-*.jar'); do
            basename=$(basename "$f" .jar)
            cp "$f" "release-jars/${basename}-${{ matrix.arch }}.jar"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jars-${{ matrix.arch }}
          path: release-jars/*.jar

  upload-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all JAR artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jars-*
          path: release-jars
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release-jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
