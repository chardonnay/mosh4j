# Build and publish JARs for x86_64 (amd64) and ARM64 when a new GitHub Release is published.
# JARs are attached to the release as *-amd64.jar and *-arm64.jar per module.

name: Release Build (amd64 + arm64)

on:
  release:
    types: [published]
  workflow_dispatch:  # run manually from Actions tab to test the workflow

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Collect and tag JARs by architecture
        run: |
          mkdir -p release-jars
          for f in $(find . -path '*/target/*.jar' \
            ! -name '*-sources*.jar' \
            ! -name '*-javadoc*.jar' \
            ! -name '*-tests*.jar' \
            ! -name 'original-*.jar'); do
            basename=$(basename "$f" .jar)
            cp "$f" "release-jars/${basename}-${{ matrix.arch }}.jar"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jars-${{ matrix.arch }}
          path: release-jars/*.jar

  upload-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all JAR artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: jars-*
          path: release-jars
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
